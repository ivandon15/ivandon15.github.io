name: "Build and Deploy"
on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - .gitignore
      - README.md
      - LICENSE

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # submodules: true
          # If using the 'assets' git submodule from Chirpy Starter, uncomment above
          # (See: https://github.com/cotes2020/chirpy-starter/tree/main/assets)

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.3
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll b -d "_site${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: "production"

      - name: Checkout Peptide Atlas
        uses: actions/checkout@v6
        with:
          repository: ivandon15/PeptideAtlas
          ref: main
          path: .peptide-atlas-source
          persist-credentials: false

      - name: Setup Node for Peptide Atlas
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .peptide-atlas-source/package-lock.json

      - name: Build public Peptide Atlas
        working-directory: .peptide-atlas-source
        run: |
          npm ci
          npm run build:public
        env:
          VITE_ATLAS_DATA_URL: https://raw.githubusercontent.com/ivandon15/PeptideAtlas/main/data/public/snapshot.json

      - name: Add Peptide Atlas to the built blog
        run: |
          mkdir -p "_site${{ steps.pages.outputs.base_path }}/peptide-atlas"
          cp -R .peptide-atlas-source/dist-public/. "_site${{ steps.pages.outputs.base_path }}/peptide-atlas/"

      # - name: Test site
      #   run: |
      #     bundle exec htmlproofer _site \
      #       \-\-disable-external \
      #       \-\-enforce-https=false \
      #       \-\-ignore-urls "/^http:\/\/127.0.0.1/,/^http:\/\/0.0.0.0/,/^http:\/\/localhost/"

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "_site${{ steps.pages.outputs.base_path }}"

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
